name: Lab (thử nghiệm)

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy lab worker
        run: npx wrangler deploy --config lab/wrangler.toml
      - name: Test
        run: |
          sleep 8
          curl -s "https://trmnl-live-lab.meohocgioi.workers.dev/limits"
          U=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://www.tiktok.com/@quakhu.cuaanh/live',safe=''))")
          curl -s -D h.txt -o yt.png --max-time 120 "https://trmnl-live-lab.meohocgioi.workers.dev/shot?save=1&url=$U"
          file yt.png; grep -i "content-type\|x-ms" h.txt; head -c 300 yt.png | grep -a error || true
      - uses: actions/upload-artifact@v4
        with:
          name: shot
          path: yt.png
