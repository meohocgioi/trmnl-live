name: Lab (thử nghiệm)

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy lab worker
        run: npx wrangler deploy --config lab/wrangler.toml
      - name: Test
        run: |
          sleep 8
          V=$(curl -s "https://trmnl-live-lab.meohocgioi.workers.dev/yt?h=tructiepgame-official" | grep -oE '"videoId": "[^"]+"' | cut -d'"' -f4)
          echo "videoId=$V"
          for i in 1 2 3; do
            curl -s -D h.txt -o yt.png --max-time 90 "https://trmnl-live-lab.meohocgioi.workers.dev/shot?url=https%3A%2F%2Fwww.youtube.com%2Fembed%2F$V%3Fautoplay%3D1%26mute%3D1%26controls%3D0%26rel%3D0"
            file yt.png; grep -i "content-type\|x-ms" h.txt
            grep -q "429" yt.png 2>/dev/null && { cat yt.png; sleep 25; continue; }
            break
          done
          head -c 300 yt.png | grep -a error || true
      - uses: actions/upload-artifact@v4
        with:
          name: shot
          path: yt.png
