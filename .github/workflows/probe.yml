name: Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Lab test with retries
        run: |
          for i in 1 2 3 4 5; do
            OUT=$(curl -s --max-time 90 "https://trmnl-live-lab.meohocgioi.workers.dev/?u=quakhu.cuaanh&w=10000")
            echo "$OUT" | grep -q '429' || break
            echo "try $i: 429, waiting"; sleep 30
          done
          echo "$OUT"
