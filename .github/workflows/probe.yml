name: Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Debug live check from Cloudflare
        run: |
          W=https://trmnl-live.meohocgioi.workers.dev
          for id in yt-nasa yt-lofigirl yt-mrbeast yt-UCX6OQ3DkcsbYNE6H8uQQuVA tt-embechiiu_ fb-nasa; do
            echo "=== $id"; curl -s "$W/debug/$id" | grep -vE '"(avatar|cover)"'; echo
          done
          echo "=== /trmnl"; curl -s "$W/trmnl"
